<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid decoration lines -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Brand Symbol -->
  <g transform="translate(100, 130)">
    <rect width="72" height="72" rx="18" fill="#1E293B" stroke="url(#brandGrad)" stroke-width="3" />
    <text x="36" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#38BDF8" text-anchor="middle">B</text>
  </g>

  <!-- Typography -->
  <text x="195" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1px" fill="#FFFFFF">BOOSTING <tspan fill="url(#brandGrad)">BD</tspan></text>
  
  <text x="100" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="3px" fill="#34D399">META ADS &amp; DIGITAL MARKETING AGENCY</text>

  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC">
    Scale Your Business With High-Performance
  </text>
  <text x="100" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#brandGrad)">
    Facebook &amp; Instagram Advertising
  </text>

  <text x="100" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Data-driven campaign management · Pixel &amp; CAPI tracking · Transparent ad spend
  </text>

  <!-- Footer Tag -->
  <rect x="100" y="520" width="340" height="46" rx="10" fill="#1E293B" />
  <text x="120" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#E2E8F0">
    📍 Mirpur-2, Dhaka · WhatsApp: +880 1518 961899
  </text>
</svg>
